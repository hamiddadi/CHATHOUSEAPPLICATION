appId: com.chathouse.app
name: Validate phone and mandatory consent gate without network
tags:
  - smoke
  - release-gate
  - offline
---
- launchApp:
    clearState: true
    clearKeychain: true

- extendedWaitUntil:
    visible:
      id: 'welcome-skip|auth-get-started'
    timeout: 30000
- runFlow:
    when:
      visible:
        id: 'welcome-skip'
    commands:
      - tapOn:
          id: 'welcome-skip'
          retryTapIfNoChange: true

- extendedWaitUntil:
    visible:
      id: 'auth-get-started'
    timeout: 15000
- tapOn:
    id: 'auth-get-started'
- extendedWaitUntil:
    visible:
      id: 'auth-phone-input'
    timeout: 10000
- hideKeyboard

- assertVisible:
    id: 'auth-age-confirmation'
    checked: false
- assertVisible:
    id: 'auth-terms-acceptance'
    checked: false
- assertVisible:
    id: 'auth-privacy-acknowledgement'
    checked: false
- assertVisible:
    id: 'auth-phone-submit'
    enabled: false

# Choose a deterministic numbering plan instead of relying on the simulator's
# locale, then complete the form without submitting it to the offline API.
- tapOn:
    id: 'auth-country-selector'
- extendedWaitUntil:
    visible:
      id: 'country-option-us'
    timeout: 5000
- tapOn:
    id: 'country-option-us'
- tapOn:
    id: 'auth-phone-input'
- inputText: '4155552671'
- hideKeyboard
- tapOn:
    id: 'auth-age-confirmation'
- tapOn:
    id: 'auth-terms-acceptance'
- tapOn:
    id: 'auth-privacy-acknowledgement'

- extendedWaitUntil:
    visible:
      id: 'auth-phone-submit'
      enabled: true
    timeout: 5000
- assertVisible:
    id: 'auth-age-confirmation'
    checked: true
- assertVisible:
    id: 'auth-terms-acceptance'
    checked: true
- assertVisible:
    id: 'auth-privacy-acknowledgement'
    checked: true

# Each mandatory acknowledgement remains a live gate. Do not tap Submit: this
# flow deliberately makes no OTP/backend request.
- tapOn:
    id: 'auth-privacy-acknowledgement'
- assertVisible:
    id: 'auth-privacy-acknowledgement'
    checked: false
- assertVisible:
    id: 'auth-phone-submit'
    enabled: false
- tapOn:
    id: 'auth-privacy-acknowledgement'
- extendedWaitUntil:
    visible:
      id: 'auth-phone-submit'
      enabled: true
    timeout: 5000
