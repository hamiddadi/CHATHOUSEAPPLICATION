apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
// FCM (de-Expo push): reads google-services.json + the google-services classpath
// declared in the root build.gradle. Must come after the Android app plugin.
apply plugin: "com.google.gms.google-services"

def projectRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath()
def configuredVersionCode = System.getenv('VERSION_CODE') ?: project.findProperty('VERSION_CODE')
def configuredVersionName = System.getenv('VERSION_NAME') ?: project.findProperty('VERSION_NAME')
def configuredMapsApiKey = (
    System.getenv('GOOGLE_MAPS_API_KEY') ?: project.findProperty('GOOGLE_MAPS_API_KEY') ?: ''
).toString()
def appVersionCode = configuredVersionCode ? configuredVersionCode.toString().toInteger() : 1
def appVersionName = configuredVersionName ? configuredVersionName.toString() : '1.0.0'

def containsReleasePlaceholder = { Object raw ->
    def value = raw == null ? '' : raw.toString().toLowerCase()
    value ==~ /.*(change[_-]?me|placeholder|replace[-_.]?with|your[-_.]?project|example\.(com|net|org|test)|__[a-z0-9_-]+__).*/
}

def isPrivateOrLocalHost = { String rawHost ->
    // java.net.URI may retain brackets around an IPv6 literal depending on
    // the JDK. Normalize them before applying the private-range checks.
    def host = (rawHost ?: '').toLowerCase()
    if (host.startsWith('[') && host.endsWith(']')) {
        host = host.substring(1, host.length() - 1)
    }
    host.isEmpty() ||
        host == 'localhost' ||
        host.endsWith('.localhost') ||
        host ==~ /^127\..*/ ||
        host == '0.0.0.0' ||
        host ==~ /^10\..*/ ||
        host ==~ /^172\.(1[6-9]|2[0-9]|3[01])\..*/ ||
        host ==~ /^192\.168\..*/ ||
        host ==~ /^169\.254\..*/ ||
        host == '::1' ||
        host == '0:0:0:0:0:0:0:1' ||
        host ==~ /^::ffff:127\..*/ ||
        host ==~ /^f[cd][0-9a-f]{2}:.*/ ||
        host ==~ /^fe[89ab][0-9a-f]:.*/
}

def validateProductionUrl = { String label, Object rawValue, String expectedScheme ->
    def value = rawValue == null ? '' : rawValue.toString()
    java.net.URI uri
    try {
        uri = new java.net.URI(value)
    } catch (Exception ignored) {
        throw new RuntimeException("$label is malformed in .env.production.")
    }
    def normalizedHost = (uri.host ?: '').replaceAll(/^\[|\]$/, '')
    def isSingleLabelHost = normalizedHost &&
        !normalizedHost.contains('.') &&
        !normalizedHost.contains(':')
    def invalidPort = uri.port == 0 ||
        uri.port > 65535 ||
        (uri.rawAuthority ?: '').endsWith(':')
    if (
        !expectedScheme.equalsIgnoreCase(uri.scheme) ||
        !normalizedHost ||
        uri.userInfo ||
        isSingleLabelHost ||
        invalidPort ||
        containsReleasePlaceholder(value) ||
        isPrivateOrLocalHost(normalizedHost)
    ) {
        throw new RuntimeException(
            "$label must use ${expectedScheme}:// with a public, non-placeholder production host."
        )
    }
}

def readProductionEnv = { File envFile ->
    def values = [:]
    envFile.eachLine('UTF-8') { rawLine ->
        def line = rawLine.replace('\r', '').trim()
        if (line && !line.startsWith('#')) {
            def separator = line.indexOf('=')
            if (separator > 0) {
                def key = line.substring(0, separator).trim()
                def value = line.substring(separator + 1).trim()
                if (
                    value.length() >= 2 &&
                    (
                        (value.startsWith('"') && value.endsWith('"')) ||
                        (value.startsWith("'") && value.endsWith("'"))
                    )
                ) {
                    value = value.substring(1, value.length() - 1)
                }
                values[key] = value
            }
        }
    }
    values
}

def validateProductionFirebase = {
    def firebaseConfigFile = file('google-services.json')
    if (!firebaseConfigFile.exists()) {
        throw new RuntimeException(
            'android/app/google-services.json is required for a production release.'
        )
    }

    def firebaseConfig
    try {
        firebaseConfig = new groovy.json.JsonSlurper().parse(firebaseConfigFile)
    } catch (Exception ignored) {
        throw new RuntimeException('android/app/google-services.json is not valid JSON.')
    }

    def firebaseClient = (firebaseConfig.client ?: []).find { client ->
        client?.client_info?.android_client_info?.package_name == 'com.chathouse.app'
    }
    def projectId = firebaseConfig?.project_info?.project_id?.toString() ?: ''
    def appId = firebaseClient?.client_info?.mobilesdk_app_id?.toString() ?: ''
    def firebaseApiKey = (firebaseClient?.api_key ?: []).find()?.current_key?.toString() ?: ''
    if (
        !firebaseClient ||
        !projectId ||
        containsReleasePlaceholder(projectId) ||
        !(appId ==~ /^\d+:\d+:android:[0-9A-Fa-f]+$/) ||
        !(firebaseApiKey ==~ /^AIza[0-9A-Za-z_-]{35}$/)
    ) {
        throw new RuntimeException(
            'google-services.json is a placeholder or does not match com.chathouse.app.'
        )
    }
}

def validateProductionReleaseConfiguration = {
    if (System.getenv('ENVFILE') != '.env.production') {
        throw new RuntimeException(
            'Production release tasks require ENVFILE=.env.production. ' +
            'Use scripts/build-release-aab.ps1.'
        )
    }
    if (!(configuredVersionCode?.toString() ==~ /^[1-9]\d*$/)) {
        throw new RuntimeException(
            'Production release tasks require an explicit positive VERSION_CODE.'
        )
    }
    if (
        !(
            configuredVersionName?.toString() ==~
            /^[0-9]+(\.[0-9]+){1,3}([+-][0-9A-Za-z.-]+)?$/
        )
    ) {
        throw new RuntimeException(
            'Production release tasks require an explicit semantic VERSION_NAME.'
        )
    }
    if (!(configuredMapsApiKey ==~ /^AIza[0-9A-Za-z_-]{35}$/)) {
        throw new RuntimeException(
            'Production release tasks require a valid GOOGLE_MAPS_API_KEY.'
        )
    }

    def productionEnvFile = new File(projectRoot, '.env.production')
    if (!productionEnvFile.exists()) {
        throw new RuntimeException(
            '.env.production is required for a production release.'
        )
    }
    def productionEnv = readProductionEnv(productionEnvFile)
    if (productionEnv['ENV'] != 'production') {
        throw new RuntimeException('.env.production must contain ENV=production.')
    }
    if (productionEnv['REALTIME_ENABLED'] != 'true') {
        throw new RuntimeException('.env.production must contain REALTIME_ENABLED=true.')
    }
    validateProductionUrl('API_BASE_URL', productionEnv['API_BASE_URL'], 'https')
    validateProductionUrl('WS_BASE_URL', productionEnv['WS_BASE_URL'], 'wss')
    validateProductionUrl('LIVEKIT_URL', productionEnv['LIVEKIT_URL'], 'wss')
    validateProductionFirebase()
}

def releaseSigningProperties = [
    'CHATHOUSE_UPLOAD_STORE_FILE',
    'CHATHOUSE_UPLOAD_STORE_PASSWORD',
    'CHATHOUSE_UPLOAD_KEY_ALIAS',
    'CHATHOUSE_UPLOAD_KEY_PASSWORD'
]
def validateReleaseSigning = {
    def missingSigningProperties = releaseSigningProperties.findAll { !project.hasProperty(it) }
    if (!missingSigningProperties.isEmpty()) {
        throw new RuntimeException(
            "Release signing is required. Missing ${missingSigningProperties.join(', ')} " +
            '(see docs/RELEASE-SIGNING.md).'
        )
    }
    def releaseStoreName = new File(project.property('CHATHOUSE_UPLOAD_STORE_FILE').toString()).name
    def releaseKeyAlias = project.property('CHATHOUSE_UPLOAD_KEY_ALIAS').toString()
    def usesSharedDebugKey = releaseStoreName.equalsIgnoreCase('debug.keystore') ||
        releaseKeyAlias.equalsIgnoreCase('androiddebugkey')
    def allowsTechnicalDebugSigning = (
        project.findProperty('CHATHOUSE_ALLOW_DEBUG_RELEASE_SIGNING') ?: 'false'
    ).toString().toBoolean()
    if (allowsTechnicalDebugSigning && !usesSharedDebugKey) {
        throw new RuntimeException(
            'CHATHOUSE_ALLOW_DEBUG_RELEASE_SIGNING=true is reserved for the shared ' +
            'debug key used by non-production packaging checks.'
        )
    }
    if (usesSharedDebugKey) {
        if (allowsTechnicalDebugSigning) {
            return
        }
        throw new RuntimeException(
            'The shared Android debug key is forbidden for release tasks. ' +
            'Use the real upload key, or explicitly opt in only for a non-production packaging check.'
        )
    }
    validateProductionReleaseConfiguration()
}

// Inspect the resolved task graph instead of only the task names typed on the
// command line. Aggregate tasks such as `build`, `assemble` and `bundle` can
// include a Release variant even though their own names do not contain
// "release"; they must not bypass the signing guard.
gradle.taskGraph.whenReady { graph ->
    def releaseTaskScheduled = graph.allTasks.any { task ->
        def taskName = task.name.toLowerCase()
        task.project == project &&
            taskName ==~ /^(assemble|bundle|package|install|publish).*release.*$/
    }
    if (releaseTaskScheduled) {
        validateReleaseSigning()
    }
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    // Entry point is index.ts (TypeScript) — set explicitly because RNGP's
    // default detection only looks for index.android.js / index.js. The bundle
    // CLI, reactNativeDir, hermesCommand and codegenDir resolve to their
    // react-native defaults (de-Expo: dropped the @expo/cli `export:embed`
    // bundler and expo/scripts/resolveAppEntry).
    entryFile = file("../../index.ts")

    enableBundleCompression = (findProperty('android.enableBundleCompression') ?: false).toBoolean()

    /* Folders */
     //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]

    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true in release builds to optimize the app using [R8](https://developer.android.com/topic/performance/app-optimization/enable-app-optimization).
 */
def enableMinifyInReleaseBuilds = (findProperty('android.enableMinifyInReleaseBuilds') ?: false).toBoolean()

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.0.1'

// The Sentry Gradle script only uploads release source maps; the runtime SDK
// is autolinked independently. Apply the upload hook only when all credentials
// are present so lint/packaging cannot fail halfway through because Sentry is
// intentionally disabled or not provisioned yet.
def sentryProperties = new Properties()
def sentryPropertiesFile = file("$rootDir/sentry.properties")
if (sentryPropertiesFile.exists()) {
    sentryPropertiesFile.withInputStream { sentryProperties.load(it) }
}
def sentryUploadDisabled = System.getenv('SENTRY_DISABLE_AUTO_UPLOAD') == 'true'
def sentryUploadConfigured = (
    System.getenv('SENTRY_AUTH_TOKEN') &&
    (System.getenv('SENTRY_ORG') ?: sentryProperties.getProperty('defaults.org')) &&
    (System.getenv('SENTRY_PROJECT') ?: sentryProperties.getProperty('defaults.project'))
)
if (!sentryUploadDisabled && sentryUploadConfigured) {
    apply from: new File(["node", "--print", "require('path').dirname(require.resolve('@sentry/react-native/package.json'))"].execute().text.trim(), "sentry.gradle")
} else {
    logger.lifecycle('Sentry source-map upload disabled: provide SENTRY_AUTH_TOKEN, SENTRY_ORG and SENTRY_PROJECT to enable it.')
}

android {
    ndkVersion = rootProject.ext.ndkVersion

    buildToolsVersion = rootProject.ext.buildToolsVersion
    compileSdk = rootProject.ext.compileSdkVersion

    namespace = 'com.chathouse.app'
    defaultConfig {
        applicationId = 'com.chathouse.app'
        minSdk = rootProject.ext.minSdkVersion
        targetSdk = rootProject.ext.targetSdkVersion
        versionCode = appVersionCode
        versionName = appVersionName

        // Google Maps Android API key. Injected at build time (NOT committed) so
        // the live key never lands in git history. Provide it via the
        // GOOGLE_MAPS_API_KEY env var (the existing .env workflow) or a
        // `GOOGLE_MAPS_API_KEY=...` line in ~/.gradle/gradle.properties. Empty ⇒
        // the Map tab renders blank / crashes (Maps SDK rejects an empty key).
        manifestPlaceholders = [
            GOOGLE_MAPS_API_KEY: configuredMapsApiKey
        ]

    }
    signingConfigs {
        debug {
            storeFile = file('debug.keystore')
            storePassword = 'android'
            keyAlias = 'androiddebugkey'
            keyPassword = 'android'
        }
        // Real upload/release signing (de-Expo: EAS used to own this). The
        // keystore + passwords are NEVER committed — supply them out-of-band via
        // ~/.gradle/gradle.properties, -P flags, or ORG_GRADLE_PROJECT_* env vars
        // (CI secrets):
        //   CHATHOUSE_UPLOAD_STORE_FILE=chathouse-upload.jks   (path under android/app/)
        //   CHATHOUSE_UPLOAD_STORE_PASSWORD=…
        //   CHATHOUSE_UPLOAD_KEY_ALIAS=chathouse
        //   CHATHOUSE_UPLOAD_KEY_PASSWORD=…
        // See docs/RELEASE-SIGNING.md for the keytool generation command.
        release {
            if (project.hasProperty('CHATHOUSE_UPLOAD_STORE_FILE')) {
                // All four props are companions: fail fast with a clear message
                // if STORE_FILE is set but a password/alias is missing (otherwise
                // Gradle throws an opaque MissingPropertyException).
                ['CHATHOUSE_UPLOAD_STORE_PASSWORD', 'CHATHOUSE_UPLOAD_KEY_ALIAS', 'CHATHOUSE_UPLOAD_KEY_PASSWORD'].each { prop ->
                    if (!project.hasProperty(prop)) {
                        // Plain java.lang.RuntimeException rather than
                        // GradleException: it aborts the configuration phase with
                        // the same clear message, but is always resolvable by the
                        // VSCode Gradle language server — which has no Gradle API
                        // on its classpath and so flags org.gradle.api.* (even
                        // fully-qualified) as "unable to resolve class".
                        throw new RuntimeException("$prop must be set alongside CHATHOUSE_UPLOAD_STORE_FILE for release signing (see docs/RELEASE-SIGNING.md)")
                    }
                }
                // CHATHOUSE_UPLOAD_STORE_FILE is resolved relative to this module
                // dir (android/app/); use an absolute path in CI if the keystore
                // lives elsewhere.
                storeFile = file(CHATHOUSE_UPLOAD_STORE_FILE)
                storePassword = CHATHOUSE_UPLOAD_STORE_PASSWORD
                keyAlias = CHATHOUSE_UPLOAD_KEY_ALIAS
                keyPassword = CHATHOUSE_UPLOAD_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        debug {
            signingConfig = signingConfigs.debug
        }
        release {
            // Shared debug signing is rejected by the configuration guard unless
            // a CI/local packaging check explicitly opts into the non-production
            // CHATHOUSE_ALLOW_DEBUG_RELEASE_SIGNING flag.
            signingConfig = signingConfigs.release
            def enableShrinkResources = findProperty('android.enableShrinkResourcesInReleaseBuilds') ?: 'false'
            shrinkResources = enableShrinkResources.toBoolean()
            minifyEnabled = enableMinifyInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            def enablePngCrunchInRelease = findProperty('android.enablePngCrunchInReleaseBuilds') ?: 'true'
            crunchPngs = enablePngCrunchInRelease.toBoolean()
        }
    }
    androidResources {
        ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
    lint {
        abortOnError = true
        // Third-party modules are linted by their own projects. Restrict this
        // gate to ChatHouse sources so CI remains focused and reasonably fast.
        checkDependencies = false
    }
}

// Apply static values from `gradle.properties` to the `android.packagingOptions`
// Accepts values in comma delimited lists, example:
// android.packagingOptions.pickFirsts=/LICENSE,**/picasa.ini
["pickFirsts", "excludes", "merges", "doNotStrip"].each { prop ->
    // Split option: 'foo,bar' -> ['foo', 'bar']
    def options = (findProperty("android.packagingOptions.$prop") ?: "").split(",");
    // Trim all elements in place.
    for (i in 0..<options.size()) options[i] = options[i].trim();
    // `[] - ""` is essentially `[""].filter(Boolean)` removing all empty strings.
    options -= ""

    if (options.length > 0) {
        println "android.packagingOptions.$prop += $options ($options.length)"
        // Ex: android.packagingOptions.pickFirsts += '**/SCCS/**'
        options.each {
            android.packagingOptions[prop] += it
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    // Splash-screen theme attrs (Theme.SplashScreen + windowSplashScreen*) used by
    // res/values/styles.xml (MainActivity launch theme). Previously pulled in
    // transitively by expo-splash-screen; added explicitly after that package was
    // removed in the de-Expo migration, or AAPT resource linking fails.
    implementation("androidx.core:core-splashscreen:1.2.0")

    // de-Expo: the optional animated-gif / animated-webp Fresco add-ons were
    // wired through the Expo version catalog (`expoLibs.versions.fresco`), which
    // no longer exists. React Native's bundled Fresco still decodes static
    // PNG/JPEG/WebP; re-add the extras with an explicit Fresco version here if
    // animated GIF/WebP playback is needed.

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
