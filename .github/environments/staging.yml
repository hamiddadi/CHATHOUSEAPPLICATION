# ═════════════════════════════════════════════════════════════════════════════
# GitHub Environment — STAGING (DOCUMENTATION ONLY)
#
# ┌───────────────────────────────────────────────────────────────────────────┐
# │ IMPORTANT: GitHub does NOT auto-read environments from this file.          │
# │ Environments are configured in:                                            │
# │   • repo Settings → Environments  (UI), or                                 │
# │   • the GitHub REST API (PUT /repos/{owner}/{repo}/environments/{name}),   │
# │   • Terraform (github_repository_environment / *_deployment_branch_policy /│
# │     github_actions_environment_secret resources).                          │
# │ This file documents the DESIRED STATE so it is reviewable in PRs and the   │
# │ intended config is version-controlled. Apply it by hand or via IaC.        │
# └───────────────────────────────────────────────────────────────────────────┘
#
# Referenced by `.github/workflows/cd-staging.yml` (job deploy-staging:
# `environment: staging`) and by `.github/workflows/rollback.yml`.
# ═════════════════════════════════════════════════════════════════════════════

environment:
  name: staging

  # The deployment URL shown in the GitHub UI for this environment.
  url: https://staging-api.chathouse.app

  # ── Protection rules ──────────────────────────────────────────────────────
  # Staging is low-friction: auto-deploy from main, no manual approval. Tighten
  # for production (see note at bottom).
  protection_rules:
    # No required reviewers on staging → deploys proceed automatically.
    required_reviewers: []

    # Optional wait timer (minutes) before a deployment runs. 0 = none.
    wait_timer_minutes: 0

    # Prevent self-review (only relevant once reviewers are added).
    prevent_self_review: false

    # Allow administrators to bypass configured protection rules.
    allow_admins_to_bypass: true

  # ── Deployment branch policy ──────────────────────────────────────────────
  # Only deployments originating from `main` may use this environment.
  deployment_branch_policy:
    protected_branches: false
    custom_branch_policies: true
    allowed_branches:
      - main

  # ── Environment SECRETS ───────────────────────────────────────────────────
  # Values are NOT stored here — set them in Settings → Environments → staging
  # → Environment secrets (or via the REST/Terraform API). Listed for tracking.
  secrets:
    - name: STAGING_HOST # staging host IP / DNS for SSH deploy
    - name: STAGING_USER # SSH user on the staging host
    - name: STAGING_SSH_KEY # private SSH key (PEM) for STAGING_USER
    - name: STAGING_HOST_FINGERPRINT # pinned SSH host key (SHA256:...)
    # SLACK_WEBHOOK_URL is optional and must be a repository/organization Actions
    # secret: the notification job deliberately does not enter this Environment.
    # GITHUB_TOKEN is auto-provided to the workflow for GHCR push — not set here.

  # ── Environment VARIABLES (non-secret) ────────────────────────────────────
  # Visible config; safe to expose. Set under Environment variables.
  variables:
    - name: DEPLOY_DIR
      value: /opt/chathouse/backend # dir on host holding docker-compose.yml + .env
    - name: BASE_URL
      value: http://localhost:4000 # health-check target on the host
    - name: API_SERVICE
      value: api # docker compose service name to recreate
    # Required release-gate origins. Deliberately no repository fallback: set
    # both to the real staging HTTPS hosts after DNS/TLS are provisioned.
    - name: PUBLIC_API_URL
    - name: PUBLIC_APP_URL

# ─────────────────────────────────────────────────────────────────────────────
# PRODUCTION environment (create separately, same mechanism, STRICTER rules):
#   • name: production
#   • protection_rules.required_reviewers: [<at least one on-call/lead>]
#   • protection_rules.prevent_self_review: true
#   • protection_rules.allow_admins_to_bypass: false
#   • deployment_branch_policy: custom patterns allowing BOTH:
#       - main
#       - 'v*.*.*'
#     `main` is required for the protected mobile-signing, Go-Live preflight
#     and emergency rollback workflows. The tag pattern is required for normal
#     production CD. Allowing `main` here does not authorize a backend release:
#     `cd-production.yml` still rejects every ref that is not an exact stable
#     `vMAJOR.MINOR.PATCH` tag before resolving the staging-tested digest.
#   • environment_secrets:
#       - PROD_HOST
#       - PROD_USER
#       - PROD_SSH_KEY
#       - PROD_HOST_FINGERPRINT
#       - MOBILE_PRODUCTION_ENV_BASE64
#       - BACKEND_PRODUCTION_ENV_BASE64
#       - FIREBASE_ANDROID_CONFIG_BASE64
#       - FIREBASE_IOS_CONFIG_BASE64
#       - ANDROID_UPLOAD_KEYSTORE_BASE64
#       - ANDROID_UPLOAD_STORE_PASSWORD
#       - ANDROID_UPLOAD_KEY_ALIAS
#       - ANDROID_UPLOAD_KEY_PASSWORD
#       - IOS_DISTRIBUTION_CERTIFICATE_BASE64
#       - IOS_DISTRIBUTION_CERTIFICATE_PASSWORD
#       - IOS_APPSTORE_PROVISIONING_PROFILE_BASE64
#       - METRICS_TOKEN_BASE64
#   • environment_variables:
#       - DEPLOY_DIR
#       - BASE_URL
#       - API_SERVICE
#       - PUBLIC_RELEASE_ENABLED
#       - IOS_TEAM_ID
#       - ANDROID_APP_SIGNING_SHA256
#       - GO_LIVE_STORE_EVIDENCE_BASE64
#       - API_HEALTH_URL
#       - SUPPORT_URL
#       - PRIVACY_URL
#       - TERMS_URL
#       - ACCOUNT_DELETION_URL
#       - APP_URL
#       - LIVEKIT_HTTPS_URL
#   • repository_or_organization_secrets:
#       - SLACK_WEBHOOK_URL
#     The CD notification job has no `environment: production`, so an
#     Environment-only webhook would be invisible and notifications would be
#     skipped. This webhook is optional; scope it at repository/organization
#     level when notifications are required.
#   • automatic_secrets:
#       - GITHUB_TOKEN
#     GitHub injects this token; never create or copy it manually.
# Referenced by `.github/workflows/cd-production.yml`, `rollback.yml`,
# `mobile-store-artifacts.yml` and `go-live-preflight.yml`.
# ─────────────────────────────────────────────────────────────────────────────
