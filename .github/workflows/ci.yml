name: CI

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22.23.1'
  MAESTRO_VERSION: '2.4.0'
  ACTIONLINT_VERSION: '1.7.12'
  ACTIONLINT_LINUX_AMD64_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'

jobs:
  source-integrity:
    name: Source - exact checked-out revision
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Prove that CI validates the event SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ ! "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "GitHub did not provide a full commit SHA: ${EXPECTED_SHA}" >&2
            exit 1
          fi
          if [ "$actual_sha" != "$EXPECTED_SHA" ]; then
            echo "Checked-out revision ${actual_sha} differs from event SHA ${EXPECTED_SHA}" >&2
            exit 1
          fi
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "Checkout contains tracked or untracked modifications before validation" >&2
            exit 1
          fi
          echo "Validated exact revision \`${actual_sha}\`." >> "$GITHUB_STEP_SUMMARY"

  workflow-lint:
    name: Workflows - actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate GitHub Actions workflows with a verified actionlint binary
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          install_dir="$RUNNER_TEMP/actionlint"
          curl -fsSLo "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_LINUX_AMD64_SHA256" "$archive" | sha256sum --check
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" actionlint
          "$install_dir/actionlint" -color

  go-live-preflight-contract:
    name: Go-Live preflight - contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Test the dependency-free preflight
        run: node --test scripts/go-live-preflight.test.mjs
      - name: Validate this exact checkout through the shared preflight
        env:
          GO_LIVE_EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/go-live-preflight.mjs --scope source

  # Frontend (React Native)
  frontend-lint:
    name: Frontend — Lint + Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run lint -- --max-warnings 0
      - run: npm run format:check

  frontend-typecheck:
    name: Frontend — tsc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck

  frontend-test:
    name: Frontend — Jest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run test:ci
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: frontend-coverage
          path: coverage/
          retention-days: 7

  # Native builds
  android-build:
    name: Android — Build, lint + Maestro E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test the fail-closed Android signature verifier
        run: node --test scripts/verify-android-jar-signature.test.mjs
      - run: npm ci
      - name: Configure Firebase for native compile
        shell: bash
        env:
          FIREBASE_ANDROID_CONFIG_BASE64: ${{ secrets.FIREBASE_ANDROID_CONFIG_BASE64 }}
        run: |
          if [[ -n "$FIREBASE_ANDROID_CONFIG_BASE64" ]]; then
            printf '%s' "$FIREBASE_ANDROID_CONFIG_BASE64" | base64 --decode > android/app/google-services.json
          else
            cp android/app/google-services.json.example android/app/google-services.json
          fi
      - run: chmod +x android/gradlew
      - name: Assemble and lint one CI architecture
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:lintDebug :app:testDebugUnitTest -PreactNativeArchitectures=x86_64 --no-daemon
      - name: Validate release packaging with the non-production debug key
        working-directory: android
        env:
          ENVFILE: .env.test
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
        run: >-
          ./gradlew
          :app:assembleRelease
          :app:bundleRelease
          :app:lintRelease
          -PreactNativeArchitectures=x86_64
          -PCHATHOUSE_UPLOAD_STORE_FILE=debug.keystore
          -PCHATHOUSE_UPLOAD_STORE_PASSWORD=android
          -PCHATHOUSE_UPLOAD_KEY_ALIAS=androiddebugkey
          -PCHATHOUSE_UPLOAD_KEY_PASSWORD=android
          -PCHATHOUSE_ALLOW_DEBUG_RELEASE_SIGNING=true
          --no-daemon
      - name: Install pinned Maestro CLI
        shell: bash
        run: |
          export MAESTRO_VERSION="${{ env.MAESTRO_VERSION }}"
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          "$HOME/.maestro/bin/maestro" --version
      - name: Run smoke flow on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          script: |
            mkdir -p e2e-artifacts/android
            ENVFILE=.env.test nohup npm start -- --reset-cache > e2e-artifacts/android/metro.log 2>&1 &
            for attempt in {1..60}; do
              if curl -fsS http://127.0.0.1:8081/status; then
                break
              fi
              sleep 2
            done
            curl -fsS http://127.0.0.1:8081/status
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            "$HOME/.maestro/bin/maestro" test \
              --format junit \
              --output e2e-artifacts/android/report.xml \
              --test-output-dir e2e-artifacts/android/run \
              .maestro
      - name: Upload Android E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-maestro
          path: e2e-artifacts/android/
          if-no-files-found: warn
          retention-days: 7

  ios-build:
    name: iOS — Build + Maestro E2E
    runs-on: macos-latest
    env:
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
    steps:
      - uses: actions/checkout@v5
      - name: Require an App-Store-compatible Xcode toolchain
        shell: bash
        run: |
          xcodebuild -version
          XCODE_MAJOR="$(xcodebuild -version | awk '/Xcode/{split($2, v, "."); print v[1]}')"
          if [[ ! "$XCODE_MAJOR" =~ ^[0-9]+$ ]] || (( XCODE_MAJOR < 26 )); then
            echo "Xcode 26 or newer is required for App Store submissions." >&2
            exit 1
          fi
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: npm ci
      - run: bundle install
      - name: Configure Firebase for native compile
        shell: bash
        env:
          FIREBASE_IOS_CONFIG_BASE64: ${{ secrets.FIREBASE_IOS_CONFIG_BASE64 }}
        run: |
          if [[ -n "$FIREBASE_IOS_CONFIG_BASE64" ]]; then
            printf '%s' "$FIREBASE_IOS_CONFIG_BASE64" | base64 --decode > ios/ChatHouse/GoogleService-Info.plist
          else
            cp ios/ChatHouse/GoogleService-Info.plist.example ios/ChatHouse/GoogleService-Info.plist
          fi
      - name: Install CocoaPods
        run: bundle exec pod install --project-directory=ios --repo-update
      - name: Build for iOS Simulator
        run: >-
          xcodebuild
          -workspace ios/ChatHouse.xcworkspace
          -scheme ChatHouse
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath ios/build
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Validate unsigned iOS Release build for Simulator
        env:
          # Technical compile check only: this is not an App Store archive.
          ENVFILE: .env.test
        run: >-
          xcodebuild
          -workspace ios/ChatHouse.xcworkspace
          -scheme ChatHouse
          -configuration Release
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath ios/build-release
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Install pinned Maestro CLI
        shell: bash
        run: |
          export MAESTRO_VERSION="${{ env.MAESTRO_VERSION }}"
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          "$HOME/.maestro/bin/maestro" --version
      - name: Boot an available iPhone simulator
        shell: bash
        run: |
          IOS_SIMULATOR_UDID="$(
            xcrun simctl list devices available -j |
              ruby -rjson -e '
                devices = JSON.parse(STDIN.read).fetch("devices").values.flatten
                phone = devices.find { |device| device["isAvailable"] && device["name"].start_with?("iPhone") }
                abort "No available iPhone simulator" unless phone
                puts phone.fetch("udid")
              '
          )"
          echo "IOS_SIMULATOR_UDID=$IOS_SIMULATOR_UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$IOS_SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$IOS_SIMULATOR_UDID" -b
      - name: Run smoke flow on iOS Simulator
        shell: bash
        run: |
          mkdir -p e2e-artifacts/ios
          ENVFILE=.env.test nohup npm start -- --reset-cache > e2e-artifacts/ios/metro.log 2>&1 &
          for _ in {1..60}; do
            if curl -fsS http://127.0.0.1:8081/status; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8081/status
          APP_PATH="ios/build/Build/Products/Debug-iphonesimulator/ChatHouse.app"
          test -d "$APP_PATH"
          xcrun simctl install "$IOS_SIMULATOR_UDID" "$APP_PATH"
          "$HOME/.maestro/bin/maestro" --device "$IOS_SIMULATOR_UDID" test \
            --format junit \
            --output e2e-artifacts/ios/report.xml \
            --test-output-dir e2e-artifacts/ios/run \
            .maestro
      - name: Upload iOS E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ios-maestro
          path: e2e-artifacts/ios/
          if-no-files-found: warn
          retention-days: 7

  # Backend (Express / Prisma)
  backend-lint:
    name: Backend — Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint

  backend-typecheck:
    name: Backend — tsc
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - name: Verify sourced Postgres bootstrap isolation
        run: |
          sh scripts/deploy/test-bootstrap-app-role-source.sh
          bash scripts/deploy/test-livekit-deploy-guard.sh
          sh scripts/deploy/test-database-deploy-contract.sh

  backend-test:
    name: Backend — Jest (integration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chathouse
          POSTGRES_PASSWORD: chathouse
          POSTGRES_DB: chathouse_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U chathouse"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://chathouse:chathouse@localhost:5433/chathouse_test?schema=public
      REDIS_URL: redis://localhost:6379
      # Deterministic secrets — 32 chars of junk so env.ts zod passes.
      # Not reused anywhere real; workflow runs in an isolated VM.
      JWT_ACCESS_SECRET: ci_access_secret_0123456789abcdef0123
      JWT_REFRESH_SECRET: ci_refresh_secret_0123456789abcdef012
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      # Apply the real migration chain exactly as the production one-shot
      # `migrate` service does, so CI catches drift instead of masking it with
      # `db push`.
      - name: Apply migrations to CI Postgres
        run: npx prisma migrate deploy
      - name: Assert migration/schema parity
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - name: Bootstrap restricted CI application role
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker cp scripts/deploy/bootstrap-app-role.sh "${POSTGRES_CONTAINER_ID}:/tmp/bootstrap-app-role.sh"
          docker exec \
            -e POSTGRES_USER=chathouse \
            -e POSTGRES_PASSWORD=chathouse \
            -e POSTGRES_DB=chathouse_test \
            -e POSTGRES_APP_USER=chathouse_app_ci \
            -e POSTGRES_APP_PASSWORD=ci_app_role_0123456789abcdef \
            "$POSTGRES_CONTAINER_ID" \
            sh /tmp/bootstrap-app-role.sh
      - name: Run backend suite with the restricted runtime role
        env:
          DATABASE_URL: postgresql://chathouse_app_ci:ci_app_role_0123456789abcdef@localhost:5433/chathouse_test?schema=public
          TEST_APP_DATABASE_URL: postgresql://chathouse_app_ci:ci_app_role_0123456789abcdef@localhost:5433/chathouse_test?schema=public
          TEST_MIGRATION_DATABASE_URL: postgresql://chathouse:chathouse@localhost:5433/chathouse_test?schema=public
        run: npm run test:ci -- --testTimeout=60000
      # The full suite raises AUTH_RATE_LIMIT_MAX to 1000 (a shared in-memory
      # bucket) so the login rate-limiter assertion self-skips. Run it once in
      # isolation with a low cap so the 429 RATE_LIMIT_001 path is covered in CI.
      - name: Rate-limiter assertion (isolated low cap)
        env:
          AUTH_RATE_LIMIT_MAX: '10'
          DATABASE_URL: postgresql://chathouse_app_ci:ci_app_role_0123456789abcdef@localhost:5433/chathouse_test?schema=public
        run: npx jest auth.coverage --runInBand -t 'rate limiter'
      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-coverage
          path: backend/coverage/
          if-no-files-found: warn
          retention-days: 7

  monitoring-config:
    name: Monitoring - render and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Render Alertmanager and validate all monitoring configs
        run: |
          set -euo pipefail
          render_dir="$RUNNER_TEMP/alertmanager-rendered"
          secret_dir="$RUNNER_TEMP/monitoring-secrets"
          mkdir -p "$render_dir" "$secret_dir"
          printf '%s' 'https://hooks.slack.test/services/test/test/test' > "$secret_dir/slack"
          printf '%s' 'ci-smtp-password' > "$secret_dir/smtp"
          printf '%s' 'ci-metrics-token-at-least-32-bytes-long' > "$secret_dir/metrics"

          METRICS_TOKEN_SECRET_FILE="$secret_dir/metrics" \
          GF_SECURITY_ADMIN_PASSWORD=ci-strong-password \
          SMTP_SMARTHOST=smtp.example.test:587 \
          SMTP_FROM=alerts@example.test \
          SMTP_USERNAME=alerts@example.test \
          ALERT_EMAIL_TO=oncall@example.test \
          ALERTMANAGER_SLACK_WEBHOOK_SECRET_FILE="$secret_dir/slack" \
          ALERTMANAGER_SMTP_PASSWORD_SECRET_FILE="$secret_dir/smtp" \
            docker compose \
              -f backend/docker/monitoring/docker-compose.monitoring.yml \
              config --quiet
          METRICS_TOKEN_SECRET_FILE="$secret_dir/metrics" \
            docker compose \
              --env-file backend/.env.prod.example \
              -f backend/docker-compose.prod.yml \
              -f backend/docker/backup/docker-compose.backup.yml \
              config --quiet

          docker build \
            -f backend/docker/monitoring/alertmanager/renderer.Dockerfile \
            -t chathouse/alertmanager-config-renderer:ci \
            backend/docker/monitoring/alertmanager
          docker run --rm \
            -e SMTP_SMARTHOST=smtp.example.test:587 \
            -e SMTP_FROM=alerts@example.test \
            -e SMTP_USERNAME=alerts@example.test \
            -e ALERT_EMAIL_TO=oncall@example.test \
            -v "$PWD/backend/docker/monitoring/alertmanager/alertmanager.yml:/templates/alertmanager.yml:ro" \
            -v "$render_dir:/rendered" \
            chathouse/alertmanager-config-renderer:ci
          docker run --rm \
            -v "$render_dir/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro" \
            -v "$secret_dir/slack:/run/secrets/alertmanager_slack_webhook:ro" \
            -v "$secret_dir/smtp:/run/secrets/alertmanager_smtp_password:ro" \
            --entrypoint amtool \
            prom/alertmanager:v0.32.1 \
            check-config /etc/alertmanager/alertmanager.yml
          docker run --rm \
            -v "$PWD/backend/docker/monitoring/prometheus:/etc/prometheus:ro" \
            -v "$secret_dir/metrics:/run/secrets/chathouse_metrics_token:ro" \
            --entrypoint promtool \
            prom/prometheus:v3.12.0 \
            check config /etc/prometheus/prometheus.yml
          docker run --rm \
            -v "$PWD/backend/docker/monitoring/prometheus/rules:/rules:ro" \
            --entrypoint promtool \
            prom/prometheus:v3.12.0 \
            check rules /rules/alerts.yml

  backend-load:
    name: Backend — k6 load thresholds
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chathouse
          POSTGRES_PASSWORD: chathouse
          POSTGRES_DB: chathouse_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U chathouse"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://chathouse:chathouse@localhost:5433/chathouse_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci_access_secret_0123456789abcdef0123
      JWT_REFRESH_SECRET: ci_refresh_secret_0123456789abcdef012
      NODE_ENV: test
      HOST: 127.0.0.1
      PORT: '4000'
      LOG_LEVEL: warn
      RATE_LIMIT_MAX: '100000'
      AUTH_RATE_LIMIT_MAX: '1000'
      EXTENSIONS_ENABLED: 'false'
      MEDIASOUP_ENABLED: 'false'
      ROOM_RECORDING_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Validate load tooling without sending traffic
        run: npm run load:check
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - name: Bootstrap restricted load-test application role
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker cp scripts/deploy/bootstrap-app-role.sh "${POSTGRES_CONTAINER_ID}:/tmp/bootstrap-app-role.sh"
          docker exec \
            -e POSTGRES_USER=chathouse \
            -e POSTGRES_PASSWORD=chathouse \
            -e POSTGRES_DB=chathouse_test \
            -e POSTGRES_APP_USER=chathouse_app_ci \
            -e POSTGRES_APP_PASSWORD=ci_app_role_0123456789abcdef \
            "$POSTGRES_CONTAINER_ID" \
            sh /tmp/bootstrap-app-role.sh
      - run: npm run build
      - name: Start the compiled mono-server
        shell: bash
        run: |
          DATABASE_URL='postgresql://chathouse_app_ci:ci_app_role_0123456789abcdef@localhost:5433/chathouse_test?schema=public' \
            nohup npm start > load-api.log 2>&1 &
          for _ in {1..60}; do
            if curl -fsS http://127.0.0.1:4000/health; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:4000/health
      - name: Enforce k6 error-rate and latency thresholds
        shell: bash
        run: |
          docker run --rm --network host \
            -v "$PWD:/work" \
            -w /work \
            -e LOAD_TEST_API_URL=http://127.0.0.1:4000 \
            grafana/k6:1.7.0 run \
            --summary-export=load-summary.json \
            tests/load/k6-smoke.js
      - name: Upload load diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-load
          path: |
            backend/load-api.log
            backend/load-summary.json
          if-no-files-found: warn
          retention-days: 7

  # ─────────────────────────── Security ────────────────────────────────────────
  secrets-scan:
    name: Secrets — gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so gitleaks can scan every commit, not just HEAD.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: 'true'

  npm-audit:
    name: npm audit (blocking + reviewed backport)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        workdir: ['.', 'backend']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Build and test tooling runs arbitrary repository inputs in CI, so
      # high-severity findings in devDependencies must block too. The guard
      # permits only reviewed advisories whose patch hash, installed version,
      # dependency node and expiry are all pinned; every new advisory fails.
      - name: Test the audit guard once from the repository root
        if: ${{ matrix.workdir == '.' }}
        run: node --test scripts/npm-audit-guard.test.mjs
      - run: node scripts/npm-audit-guard.mjs --workdir "${{ matrix.workdir }}"
