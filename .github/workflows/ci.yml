name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.23.1'

jobs:
  # Frontend (React Native)
  frontend-lint:
    name: Frontend — Lint + Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run lint -- --max-warnings 0
      - run: npm run format:check

  frontend-typecheck:
    name: Frontend — tsc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck

  frontend-test:
    name: Frontend — Jest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run test:ci
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage/
          retention-days: 7

  # Native builds
  android-build:
    name: Android — Debug build + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Configure Firebase for native compile
        shell: bash
        env:
          FIREBASE_ANDROID_CONFIG_BASE64: ${{ secrets.FIREBASE_ANDROID_CONFIG_BASE64 }}
        run: |
          if [[ -n "$FIREBASE_ANDROID_CONFIG_BASE64" ]]; then
            printf '%s' "$FIREBASE_ANDROID_CONFIG_BASE64" | base64 --decode > android/app/google-services.json
          else
            cp android/app/google-services.json.example android/app/google-services.json
          fi
      - run: chmod +x android/gradlew
      - name: Assemble and lint one CI architecture
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:lintDebug -PreactNativeArchitectures=x86_64 --no-daemon

  ios-build:
    name: iOS — Simulator build
    runs-on: macos-latest
    env:
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: npm ci
      - run: bundle install
      - name: Configure Firebase for native compile
        shell: bash
        env:
          FIREBASE_IOS_CONFIG_BASE64: ${{ secrets.FIREBASE_IOS_CONFIG_BASE64 }}
        run: |
          if [[ -n "$FIREBASE_IOS_CONFIG_BASE64" ]]; then
            printf '%s' "$FIREBASE_IOS_CONFIG_BASE64" | base64 --decode > ios/ChatHouse/GoogleService-Info.plist
          else
            cp ios/ChatHouse/GoogleService-Info.plist.example ios/ChatHouse/GoogleService-Info.plist
          fi
      - name: Install CocoaPods
        run: bundle exec pod install --project-directory=ios --repo-update
      - name: Build for iOS Simulator
        run: >-
          xcodebuild
          -workspace ios/ChatHouse.xcworkspace
          -scheme ChatHouse
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build

  # Backend (Express / Prisma)
  backend-lint:
    name: Backend — Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint

  backend-typecheck:
    name: Backend — tsc
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck

  backend-test:
    name: Backend — Jest (integration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chathouse
          POSTGRES_PASSWORD: chathouse
          POSTGRES_DB: chathouse_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U chathouse"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://chathouse:chathouse@localhost:5433/chathouse_test?schema=public
      REDIS_URL: redis://localhost:6379
      # Deterministic secrets — 32 chars of junk so env.ts zod passes.
      # Not reused anywhere real; workflow runs in an isolated VM.
      JWT_ACCESS_SECRET: ci_access_secret_0123456789abcdef0123
      JWT_REFRESH_SECRET: ci_refresh_secret_0123456789abcdef012
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      # Apply the real migration chain (init -> add_profile_view -> sync_schema_drift)
      # exactly as production does (backend/Dockerfile runs `migrate deploy`), so CI
      # catches migration/schema drift instead of masking it with `db push`.
      - name: Apply migrations to CI Postgres
        run: npx prisma migrate deploy
      - run: npm test -- --forceExit --testTimeout=60000
      # The full suite raises AUTH_RATE_LIMIT_MAX to 1000 (a shared in-memory
      # bucket) so the login rate-limiter assertion self-skips. Run it once in
      # isolation with a low cap so the 429 RATE_LIMIT_001 path is covered in CI.
      - name: Rate-limiter assertion (isolated low cap)
        env:
          AUTH_RATE_LIMIT_MAX: '10'
        run: npx jest auth.coverage --runInBand --forceExit -t 'rate limiter'

  # ─────────────────────────── Security ────────────────────────────────────────
  secrets-scan:
    name: Secrets — gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so gitleaks can scan every commit, not just HEAD.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: 'true'

  npm-audit:
    name: npm audit (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        workdir: ['.', 'backend']
    defaults:
      run:
        working-directory: ${{ matrix.workdir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm audit --audit-level=high
