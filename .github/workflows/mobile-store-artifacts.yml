name: Mobile Store Artifacts - Signed Android and iOS

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Store version shared by Android and iOS (for example 1.0.0)
        required: true
        type: string
      android_version_code:
        description: Positive, unused Google Play versionCode
        required: true
        type: string
      ios_build_number:
        description: Positive, unused App Store build number
        required: true
        type: string

concurrency:
  group: mobile-store-artifacts-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  full-ci:
    name: Full CI gate
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  source-gate:
    name: Pin a reviewed source revision
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a clean commit reachable from main
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          source_sha="$(git rev-parse 'HEAD^{commit}')"
          if [ "$source_sha" != "$GITHUB_SHA" ] \
            || [[ ! "$source_sha" =~ ^[a-f0-9]{40}$ ]] \
            || ! git merge-base --is-ancestor "$source_sha" origin/main; then
            echo "Run this workflow from a reviewed commit reachable from origin/main" >&2
            exit 1
          fi
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "Release checkout is not clean" >&2
            exit 1
          fi
          echo "sha=${source_sha}" >> "$GITHUB_OUTPUT"

      - name: Validate shared release numbers
        shell: bash
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          ANDROID_VERSION_CODE: ${{ inputs.android_version_code }}
          IOS_BUILD_NUMBER: ${{ inputs.ios_build_number }}
        run: |
          set -euo pipefail
          [[ "$VERSION_NAME" =~ ^[0-9]+(\.[0-9]+){1,3}([+-][0-9A-Za-z.-]+)?$ ]] || {
            echo "version_name is invalid" >&2
            exit 1
          }
          [[ "$ANDROID_VERSION_CODE" =~ ^[1-9][0-9]*$ ]] || {
            echo "android_version_code must be positive" >&2
            exit 1
          }
          [[ "$IOS_BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            echo "ios_build_number must be positive" >&2
            exit 1
          }

  android-production-aab:
    name: Android - signed production AAB
    needs: [source-gate, full-ci]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source-gate.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Materialize protected Android build inputs
        shell: bash
        env:
          MOBILE_ENV_BASE64: ${{ secrets.MOBILE_PRODUCTION_ENV_BASE64 }}
          FIREBASE_ANDROID_BASE64: ${{ secrets.FIREBASE_ANDROID_CONFIG_BASE64 }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const files = {
            MOBILE_ENV_BASE64: path.join(process.env.GITHUB_WORKSPACE, '.env.production'),
            FIREBASE_ANDROID_BASE64: path.join(
              process.env.GITHUB_WORKSPACE,
              'android/app/google-services.json',
            ),
            ANDROID_KEYSTORE_BASE64: path.join(
              process.env.RUNNER_TEMP,
              'chathouse-upload.jks',
            ),
          };
          for (const [variable, target] of Object.entries(files)) {
            const encoded = process.env[variable] || '';
            if (!encoded) throw new Error(`${variable} is required`);
            const decoded = Buffer.from(encoded, 'base64');
            if (!decoded.length) throw new Error(`${variable} is not valid non-empty base64`);
            fs.mkdirSync(path.dirname(target), { recursive: true });
            fs.writeFileSync(target, decoded, { mode: 0o600 });
          }
          NODE

      - name: Build through the guarded production entrypoint
        shell: pwsh
        env:
          ORG_GRADLE_PROJECT_CHATHOUSE_UPLOAD_STORE_FILE: ${{ runner.temp }}/chathouse-upload.jks
          ORG_GRADLE_PROJECT_CHATHOUSE_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_CHATHOUSE_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_CHATHOUSE_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
        run: >-
          ./scripts/build-release-aab.ps1
          -EnvFile .env.production
          -VersionCode ${{ inputs.android_version_code }}
          -VersionName ${{ inputs.version_name }}

      - name: Verify and package the signed AAB
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.source-gate.outputs.sha }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.android_version_code }}
        run: |
          set -euo pipefail
          source_aab="android/app/build/outputs/bundle/release/app-release.aab"
          [ -s "$source_aab" ] || {
            echo "Production AAB is missing" >&2
            exit 1
          }
          jarsigner -verify -verbose -certs "$source_aab" > "$RUNNER_TEMP/aab-signing.txt"
          if grep -Eqi 'CN=Android Debug|androiddebugkey' "$RUNNER_TEMP/aab-signing.txt"; then
            echo "Debug-signed AAB is forbidden" >&2
            exit 1
          fi
          mkdir -p artifacts
          cp "$source_aab" artifacts/android-production.aab
          sha256="$(sha256sum artifacts/android-production.aab | awk '{print $1}')"
          jq -n \
            --arg platform android \
            --arg source_sha "$SOURCE_SHA" \
            --arg version_name "$VERSION_NAME" \
            --arg version_code "$VERSION_CODE" \
            --arg sha256 "$sha256" \
            '{
              platform: $platform,
              source_sha: $source_sha,
              version_name: $version_name,
              version_code: $version_code,
              sha256: $sha256
            }' > artifacts/android-production-manifest.json

      - name: Upload signed Android evidence
        uses: actions/upload-artifact@v4
        with:
          name: android-production-aab
          path: |
            artifacts/android-production.aab
            artifacts/android-production-manifest.json
          if-no-files-found: error
          retention-days: 30

  ios-production-xcarchive:
    name: iOS - signed production xcarchive
    needs: [source-gate, full-ci]
    runs-on: macos-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source-gate.outputs.sha }}

      - name: Require an App-Store-compatible Xcode toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcode_major="$(xcodebuild -version | awk '/Xcode/{split($2, v, "."); print v[1]}')"
          if [[ ! "$xcode_major" =~ ^[0-9]+$ ]] || (( xcode_major < 26 )); then
            echo "Xcode 26 or newer is required for App Store submissions" >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install JavaScript, Ruby and CocoaPods dependencies
        run: |
          npm ci
          bundle install
          bundle exec pod install --project-directory=ios --repo-update

      - name: Materialize protected iOS build inputs
        shell: bash
        env:
          MOBILE_ENV_BASE64: ${{ secrets.MOBILE_PRODUCTION_ENV_BASE64 }}
          FIREBASE_IOS_BASE64: ${{ secrets.FIREBASE_IOS_CONFIG_BASE64 }}
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const files = {
            MOBILE_ENV_BASE64: path.join(process.env.GITHUB_WORKSPACE, '.env.production'),
            FIREBASE_IOS_BASE64: path.join(
              process.env.GITHUB_WORKSPACE,
              'ios/ChatHouse/GoogleService-Info.plist',
            ),
            IOS_CERTIFICATE_BASE64: path.join(process.env.RUNNER_TEMP, 'distribution.p12'),
            IOS_PROFILE_BASE64: path.join(process.env.RUNNER_TEMP, 'appstore.mobileprovision'),
          };
          for (const [variable, target] of Object.entries(files)) {
            const encoded = process.env[variable] || '';
            if (!encoded) throw new Error(`${variable} is required`);
            const decoded = Buffer.from(encoded, 'base64');
            if (!decoded.length) throw new Error(`${variable} is not valid non-empty base64`);
            fs.mkdirSync(path.dirname(target), { recursive: true });
            fs.writeFileSync(target, decoded, { mode: 0o600 });
          }
          NODE

      - name: Import Apple distribution identity and profile
        shell: bash
        env:
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          [ -n "$CERTIFICATE_PASSWORD" ] || {
            echo "IOS_DISTRIBUTION_CERTIFICATE_PASSWORD is required" >&2
            exit 1
          }
          [[ "$IOS_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] || {
            echo "IOS_TEAM_ID production variable is invalid" >&2
            exit 1
          }

          keychain="$RUNNER_TEMP/chathouse-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/distribution.p12" \
            -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          security find-identity -v -p codesigning "$keychain" |
            grep -F 'Apple Distribution'

          profile_plist="$RUNNER_TEMP/appstore-profile.plist"
          security cms -D -i "$RUNNER_TEMP/appstore.mobileprovision" > "$profile_plist"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist")"
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$profile_plist")"
          profile_team="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$profile_plist")"
          application_identifier="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :Entitlements:application-identifier' \
              "$profile_plist"
          )"
          if [ "$profile_team" != "$IOS_TEAM_ID" ] \
            || [ "$application_identifier" != "${IOS_TEAM_ID}.com.chathouse.app" ] \
            || [[ ! "$profile_uuid" =~ ^[A-Fa-f0-9-]{36}$ ]] \
            || [ -z "$profile_name" ]; then
            echo "Provisioning profile does not match the production app/team" >&2
            exit 1
          fi
          profile_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profile_dir"
          cp "$RUNNER_TEMP/appstore.mobileprovision" "$profile_dir/${profile_uuid}.mobileprovision"
          {
            echo "CHATHOUSE_IOS_PROFILE_NAME<<PROFILE_NAME_EOF"
            echo "$profile_name"
            echo "PROFILE_NAME_EOF"
          } >> "$GITHUB_ENV"

      - name: Create the signed production archive
        shell: bash
        env:
          ENVFILE: .env.production
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          VERSION_NAME: ${{ inputs.version_name }}
          BUILD_NUMBER: ${{ inputs.ios_build_number }}
        run: |
          set -euo pipefail
          archive_path="$RUNNER_TEMP/ChatHouse.xcarchive"
          xcodebuild archive \
            -workspace ios/ChatHouse.xcworkspace \
            -scheme ChatHouse \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$archive_path" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$CHATHOUSE_IOS_PROFILE_NAME" \
            MARKETING_VERSION="$VERSION_NAME" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Verify and package the signed xcarchive
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.source-gate.outputs.sha }}
          VERSION_NAME: ${{ inputs.version_name }}
          BUILD_NUMBER: ${{ inputs.ios_build_number }}
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          archive_path="$RUNNER_TEMP/ChatHouse.xcarchive"
          app_path="$archive_path/Products/Applications/ChatHouse.app"
          [ -d "$app_path" ] && [ -s "$app_path/embedded.mobileprovision" ] || {
            echo "Signed archive or embedded profile is missing" >&2
            exit 1
          }
          codesign --verify --deep --strict "$app_path"
          codesign -dvv "$app_path" 2> "$RUNNER_TEMP/codesign.txt"
          grep -F "TeamIdentifier=${IOS_TEAM_ID}" "$RUNNER_TEMP/codesign.txt"
          if grep -Eqi 'Apple Development|iPhone Developer' "$RUNNER_TEMP/codesign.txt"; then
            echo "Development-signed archive is forbidden" >&2
            exit 1
          fi

          embedded_plist="$RUNNER_TEMP/embedded-profile.plist"
          security cms -D -i "$app_path/embedded.mobileprovision" > "$embedded_plist"
          aps_environment="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :Entitlements:aps-environment' \
              "$embedded_plist"
          )"
          [ "$aps_environment" = production ] || {
            echo "Archive profile does not carry production APNs entitlement" >&2
            exit 1
          }
          actual_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app_path/Info.plist")"
          actual_build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app_path/Info.plist")"
          [ "$actual_version" = "$VERSION_NAME" ] && [ "$actual_build" = "$BUILD_NUMBER" ] || {
            echo "Archived version/build does not match workflow inputs" >&2
            exit 1
          }

          mkdir -p artifacts
          tar -czf artifacts/ChatHouse.xcarchive.tgz \
            -C "$RUNNER_TEMP" \
            ChatHouse.xcarchive
          sha256="$(shasum -a 256 artifacts/ChatHouse.xcarchive.tgz | awk '{print $1}')"
          jq -n \
            --arg platform ios \
            --arg source_sha "$SOURCE_SHA" \
            --arg version_name "$VERSION_NAME" \
            --arg build_number "$BUILD_NUMBER" \
            --arg team_id "$IOS_TEAM_ID" \
            --arg sha256 "$sha256" \
            '{
              platform: $platform,
              source_sha: $source_sha,
              version_name: $version_name,
              build_number: $build_number,
              team_id: $team_id,
              archive_tar_sha256: $sha256
            }' > artifacts/ios-production-manifest.json

      - name: Upload signed iOS evidence
        uses: actions/upload-artifact@v4
        with:
          name: ios-production-xcarchive
          path: |
            artifacts/ChatHouse.xcarchive.tgz
            artifacts/ios-production-manifest.json
          if-no-files-found: error
          retention-days: 30
