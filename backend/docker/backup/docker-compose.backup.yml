# ChatHouse PostgreSQL backup override for the production stack.
#
# Always combine this file with docker-compose.prod.yml and the host .env:
#
#   docker compose --env-file .env \
#     -f docker-compose.prod.yml \
#     -f docker/backup/docker-compose.backup.yml up -d backup
#
# Ad-hoc backup:
#   docker compose --env-file .env -f docker-compose.prod.yml \
#     -f docker/backup/docker-compose.backup.yml run --rm backup pg_backup.sh
#
# Restore drill (default restores into a temporary DB, validates it, then drops):
# Pull RESTORE_CANDIDATE_IMAGE by digest first, then mount the Docker socket only
# for this ad-hoc command (never on the long-running backup service):
#   docker compose --env-file .env -f docker-compose.prod.yml \
#     -f docker/backup/docker-compose.backup.yml run --rm \
#     -v /var/run/docker.sock:/var/run/docker.sock backup pg_restore.sh

services:
  backup:
    build:
      context: .
      dockerfile: docker/backup/Dockerfile
    image: chathouse/postgres-backup:1.0.0
    container_name: chathouse-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_ADMIN_DB: ${POSTGRES_ADMIN_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      BACKUP_CRON_SCHEDULE: ${BACKUP_CRON_SCHEDULE:-0 2 * * *}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      BACKUP_DIR: /backups
      BACKUP_RUN_ON_START: ${BACKUP_RUN_ON_START:-false}
      RESTORE_MODE: ${RESTORE_MODE:-verify}
      RESTORE_ALLOW_REPLACE: ${RESTORE_ALLOW_REPLACE:-false}
      RESTORE_CANDIDATE_IMAGE: ${RESTORE_CANDIDATE_IMAGE:-}
      RESTORE_CANDIDATE_DOCKER_NETWORK: ${RESTORE_CANDIDATE_DOCKER_NETWORK:-backend_default}
      S3_BACKUP_BUCKET: ${S3_BACKUP_BUCKET:-}
      S3_BACKUP_PREFIX: ${S3_BACKUP_PREFIX:-chathouse}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    volumes:
      - backup-data:/backups

volumes:
  backup-data:
