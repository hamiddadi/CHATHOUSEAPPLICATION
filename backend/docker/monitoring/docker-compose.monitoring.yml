# ─────────────────────────────────────────────────────────────────────────
# Chathouse monitoring stack — Prometheus + Grafana + Alertmanager + exporters
#
# This is a SEPARATE compose project from the backend. To let Prometheus scrape
# the API container, it joins the backend's default network as an EXTERNAL
# network (`backend_default`, created by backend/docker-compose.prod.yml whose
# compose project name defaults to the directory "backend"). Prometheus is
# attached to BOTH the local `monitoring` network (for Grafana/Alertmanager
# DNS) and the external `chathouse` network (to reach `api:4000`).
#
# Bring up (run from this docker/monitoring directory and reuse backend/.env):
#   docker compose --env-file ../../.env -f docker-compose.monitoring.yml up -d
# Make sure the backend stack is up first so backend_default exists:
#   (in backend/)  docker compose -f docker-compose.prod.yml up -d
#
# FALLBACK — API not on backend_default (e.g. running on the host via npm):
#   1. Comment out the `chathouse` external network block + its attachment on
#      the prometheus service below.
#   2. In prometheus/prometheus.yml set the chathouse-api target to
#      `host.docker.internal:4000` and add to the prometheus service:
#        extra_hosts: ["host.docker.internal:host-gateway"]
#
# Env (backend/.env, loaded with --env-file as shown above):
#   METRICS_TOKEN_SECRET_FILE - absolute path to the shared metrics token file
#   GF_SECURITY_ADMIN_PASSWORD  - required non-default Grafana admin password
#   SMTP_SMARTHOST / SMTP_FROM / SMTP_USERNAME / ALERT_EMAIL_TO
#   ALERTMANAGER_SLACK_WEBHOOK_SECRET_FILE / ALERTMANAGER_SMTP_PASSWORD_SECRET_FILE
# ─────────────────────────────────────────────────────────────────────────

services:
  alertmanager-config-renderer:
    build:
      context: ./alertmanager
      dockerfile: renderer.Dockerfile
    image: chathouse/alertmanager-config-renderer:1.0.0
    restart: 'no'
    environment:
      SMTP_SMARTHOST: ${SMTP_SMARTHOST:?SMTP_SMARTHOST is required}
      SMTP_FROM: ${SMTP_FROM:?SMTP_FROM is required}
      SMTP_USERNAME: ${SMTP_USERNAME:?SMTP_USERNAME is required}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:?ALERT_EMAIL_TO is required}
    volumes:
      - ./alertmanager/alertmanager.yml:/templates/alertmanager.yml:ro
      - alertmanager-config:/rendered

  prometheus:
    image: prom/prometheus:v3.12.0
    container_name: chathouse-prometheus
    restart: unless-stopped
    user: root
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    secrets:
      - source: metrics_token
        target: chathouse_metrics_token
    ports:
      # Operator access only (for example through an SSH tunnel).
      - '127.0.0.1:9090:9090'
    networks:
      - monitoring
      # Reach the API container (api:4000) on the backend's default network.
      - chathouse
    depends_on:
      - alertmanager
      - node-exporter

  grafana:
    image: grafana/grafana:13.1.0
    container_name: chathouse-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?GF_SECURITY_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      # Operator access only (for example through an SSH tunnel).
      - '127.0.0.1:3001:3000'
    networks:
      - monitoring
    depends_on:
      - prometheus

  alertmanager:
    image: prom/alertmanager:v0.32.1
    container_name: chathouse-alertmanager
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    volumes:
      - alertmanager-config:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    secrets:
      - source: alertmanager_slack_webhook
        target: alertmanager_slack_webhook
      - source: alertmanager_smtp_password
        target: alertmanager_smtp_password
    ports:
      - '127.0.0.1:9093:9093'
    networks:
      - monitoring
    depends_on:
      alertmanager-config-renderer:
        condition: service_completed_successfully

  node-exporter:
    image: prom/node-exporter:v1.11.1
    container_name: chathouse-node-exporter
    restart: unless-stopped
    command:
      - '--path.rootfs=/host'
    pid: host
    volumes:
      - /:/host:ro,rslave
    # No host port: Prometheus reaches this exporter on the private network.
    networks:
      - monitoring

volumes:
  prometheus-data:
  grafana-data:
  alertmanager-data:
  alertmanager-config:

secrets:
  # Same host file used by backend/docker-compose.prod.yml. Compose mounts the
  # value read-only at /run/secrets/chathouse_metrics_token.
  metrics_token:
    file: ${METRICS_TOKEN_SECRET_FILE:?METRICS_TOKEN_SECRET_FILE is required}
  alertmanager_slack_webhook:
    file: ${ALERTMANAGER_SLACK_WEBHOOK_SECRET_FILE:?ALERTMANAGER_SLACK_WEBHOOK_SECRET_FILE is required}
  alertmanager_smtp_password:
    file: ${ALERTMANAGER_SMTP_PASSWORD_SECRET_FILE:?ALERTMANAGER_SMTP_PASSWORD_SECRET_FILE is required}

networks:
  # Local network for the monitoring services to talk to each other.
  monitoring:
    driver: bridge
  # The backend's default network, created by backend/docker-compose.prod.yml.
  # Referenced as external so Prometheus can scrape api:4000. Adjust `name`
  # if your compose project name differs (it defaults to the dir "backend").
  chathouse:
    external: true
    name: backend_default
