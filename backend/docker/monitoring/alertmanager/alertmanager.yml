# Alertmanager template for the ChatHouse monitoring stack.
#
# The config-renderer service substitutes only the non-secret template values
# into a private named volume. Slack and SMTP credentials remain Docker secret
# files and are read directly by Alertmanager.

global:
  resolve_timeout: 5m
  slack_api_url_file: /run/secrets/alertmanager_slack_webhook
  smtp_smarthost: '${SMTP_SMARTHOST}'
  smtp_from: '${SMTP_FROM}'
  smtp_auth_username: '${SMTP_USERNAME}'
  smtp_auth_password_file: /run/secrets/alertmanager_smtp_password
  smtp_require_tls: true

route:
  receiver: slack-default
  group_by: ['alertname', 'service', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = "critical"
      receiver: critical-all
      group_wait: 10s
      continue: false

receivers:
  - name: slack-default
    slack_configs:
      - channel: '#alerts'
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.service }})'
        text: >-
          {{ range .Alerts }}*{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          {{ end }}

  - name: critical-all
    slack_configs:
      - channel: '#alerts-critical'
        send_resolved: true
        title: '[CRITICAL] {{ .CommonLabels.alertname }} ({{ .CommonLabels.service }})'
        text: >-
          {{ range .Alerts }}*{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          {{ end }}
    email_configs:
      - to: '${ALERT_EMAIL_TO}'
        send_resolved: true
        headers:
          Subject: '[CRITICAL] {{ .CommonLabels.alertname }} - {{ .CommonLabels.service }}'

inhibit_rules:
  - source_matchers:
      - alertname = "APIDown"
      - severity = "critical"
    target_matchers:
      - severity =~ "warning|critical"
    equal: ['service']
