# ─────────────────────────────────────────────────────────────────────────────
# Chathouse — PRODUCTION compose (deployed to /opt/chathouse/backend on the host).
#
# This is the file the CD pipeline (.github/workflows/cd-production.yml) drives:
# it sets CHATHOUSE_API_IMAGE to the freshly-built GHCR image and runs
#   docker compose -f docker-compose.prod.yml up -d --no-deps --pull always api
#
# Unlike the dev `docker-compose.yml`, this file:
#   • pulls a built image instead of `build: .`
#   • REQUIRES every secret via ${VAR:?required} so boot fails loudly if a
#     secret is missing (no silent fallback to dev defaults)
#   • enables Redis AUTH and does NOT publish Postgres/Redis to the public NIC
#   • applies DB migrations automatically (the api image entrypoint runs
#     `prisma migrate deploy` before starting — see backend/Dockerfile)
#
# TLS: the api listens on 127.0.0.1:4000 only — put a TLS-terminating reverse
# proxy (Caddy/nginx/Traefik) in front for https://api.chathouse.app +
# wss://api.chathouse.app. Never expose :4000 directly to the internet.
#
# Provide secrets via a host-side `.env` next to this file (chmod 600) or your
# orchestrator's secret store. See `.env.prod.example`.
# ─────────────────────────────────────────────────────────────────────────────
services:
  postgres:
    image: postgres:16-alpine
    container_name: chathouse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-chathouse}
    # Bind to loopback only — the API reaches it over the compose network.
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: chathouse-redis
    restart: unless-stopped
    # AUTH on (no anonymous access) + AOF persistence.
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--requirepass',
        '${REDIS_PASSWORD:?REDIS_PASSWORD is required}',
      ]
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}

  api:
    image: ${CHATHOUSE_API_IMAGE:?CHATHOUSE_API_IMAGE is required (set by the CD pipeline)}
    container_name: chathouse-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # Extension routers remain enabled by default. Stripe is a separately
      # optional sub-feature controlled by its complete credential set below.
      EXTENSIONS_ENABLED: ${EXTENSIONS_ENABLED:-true}
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-chathouse}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required (e.g. https://app.chathouse.com)}
      PUBLIC_URL: ${PUBLIC_URL:?PUBLIC_URL is required (e.g. https://api.chathouse.app)}
      # Keep the public deletion deadline, the purge worker and the documented
      # retention policy on the same production values.
      ACCOUNT_DELETION_GRACE_DAYS: ${ACCOUNT_DELETION_GRACE_DAYS:-30}
      AUDIT_LOG_RETENTION_DAYS: ${AUDIT_LOG_RETENTION_DAYS:-90}
      GDPR_PURGE_CRON: ${GDPR_PURGE_CRON:-0 3 * * *}
      LEGAL_ENTITY_NAME: ${LEGAL_ENTITY_NAME:?LEGAL_ENTITY_NAME is required}
      LEGAL_REGISTERED_ADDRESS: ${LEGAL_REGISTERED_ADDRESS:?LEGAL_REGISTERED_ADDRESS is required}
      LEGAL_REGISTRATION_NUMBER: ${LEGAL_REGISTRATION_NUMBER:?LEGAL_REGISTRATION_NUMBER is required}
      LEGAL_JURISDICTION: ${LEGAL_JURISDICTION:?LEGAL_JURISDICTION is required}
      LEGAL_DISPUTE_PROCESS: ${LEGAL_DISPUTE_PROCESS:?LEGAL_DISPUTE_PROCESS is required}
      LEGAL_LIABILITY_TERMS: ${LEGAL_LIABILITY_TERMS:?LEGAL_LIABILITY_TERMS is required}
      LEGAL_SUPERVISORY_AUTHORITY: ${LEGAL_SUPERVISORY_AUTHORITY:?LEGAL_SUPERVISORY_AUTHORITY is required}
      LEGAL_TRANSFER_SAFEGUARDS: ${LEGAL_TRANSFER_SAFEGUARDS:?LEGAL_TRANSFER_SAFEGUARDS is required}
      LEGAL_DPO_CONTACT: ${LEGAL_DPO_CONTACT:?LEGAL_DPO_CONTACT is required (or Not appointed)}
      LEGAL_EU_REPRESENTATIVE: ${LEGAL_EU_REPRESENTATIVE:?LEGAL_EU_REPRESENTATIVE is required (or Not applicable)}
      LEGAL_DOCUMENT_VERSION: ${LEGAL_DOCUMENT_VERSION:?LEGAL_DOCUMENT_VERSION is required}
      LEGAL_DOCUMENT_EFFECTIVE_DATE: ${LEGAL_DOCUMENT_EFFECTIVE_DATE:?LEGAL_DOCUMENT_EFFECTIVE_DATE is required}
      LEGAL_SERVICE_PROVIDERS: ${LEGAL_SERVICE_PROVIDERS:?LEGAL_SERVICE_PROVIDERS is required}
      LEGAL_PROCESSING_LOCATIONS: ${LEGAL_PROCESSING_LOCATIONS:?LEGAL_PROCESSING_LOCATIONS is required}
      LEGAL_LOG_BACKUP_RETENTION: ${LEGAL_LOG_BACKUP_RETENTION:?LEGAL_LOG_BACKUP_RETENTION is required}
      LEGAL_SUPPORT_MODERATION_RETENTION: ${LEGAL_SUPPORT_MODERATION_RETENTION:?LEGAL_SUPPORT_MODERATION_RETENTION is required}
      LEGAL_MODERATION_APPEAL_ROUTE: ${LEGAL_MODERATION_APPEAL_ROUTE:?LEGAL_MODERATION_APPEAL_ROUTE is required}
      LEGAL_ADULT_CONTENT_POLICY: ${LEGAL_ADULT_CONTENT_POLICY:?LEGAL_ADULT_CONTENT_POLICY is required}
      LEGAL_CHILD_SAFETY_REPORTING_PROCESS: ${LEGAL_CHILD_SAFETY_REPORTING_PROCESS:?LEGAL_CHILD_SAFETY_REPORTING_PROCESS is required}
      LEGAL_CONTACT_PHONE: ${LEGAL_CONTACT_PHONE:?LEGAL_CONTACT_PHONE is required}
      PRIVACY_CONTACT_EMAIL: ${PRIVACY_CONTACT_EMAIL:?PRIVACY_CONTACT_EMAIL is required}
      SUPPORT_CONTACT_EMAIL: ${SUPPORT_CONTACT_EMAIL:?SUPPORT_CONTACT_EMAIL is required}
      SAFETY_CONTACT_EMAIL: ${SAFETY_CONTACT_EMAIL:?SAFETY_CONTACT_EMAIL is required}
      CHILD_SAFETY_CONTACT_NAME: ${CHILD_SAFETY_CONTACT_NAME:?CHILD_SAFETY_CONTACT_NAME is required}
      CHILD_SAFETY_CONTACT_EMAIL: ${CHILD_SAFETY_CONTACT_EMAIL:?CHILD_SAFETY_CONTACT_EMAIL is required}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:?APPLE_TEAM_ID is required}
      ANDROID_APP_SIGNING_SHA256: ${ANDROID_APP_SIGNING_SHA256:?ANDROID_APP_SIGNING_SHA256 is required}
      # Private object storage for avatars and voice notes. No public bucket or
      # local filesystem fallback is accepted in production.
      MEDIA_STORAGE_DRIVER: s3
      MEDIA_URL_SIGNING_SECRET: ${MEDIA_URL_SIGNING_SECRET:?MEDIA_URL_SIGNING_SECRET is required}
      MEDIA_EXPORT_URL_TTL_SECONDS: ${MEDIA_EXPORT_URL_TTL_SECONDS:-3600}
      MEDIA_S3_BUCKET: ${MEDIA_S3_BUCKET:?MEDIA_S3_BUCKET is required}
      MEDIA_S3_REGION: ${MEDIA_S3_REGION:?MEDIA_S3_REGION is required}
      MEDIA_S3_ENDPOINT: ${MEDIA_S3_ENDPOINT:?MEDIA_S3_ENDPOINT is required}
      MEDIA_S3_ACCESS_KEY: ${MEDIA_S3_ACCESS_KEY:?MEDIA_S3_ACCESS_KEY is required}
      MEDIA_S3_SECRET_KEY: ${MEDIA_S3_SECRET_KEY:?MEDIA_S3_SECRET_KEY is required}
      MEDIA_S3_FORCE_PATH_STYLE: ${MEDIA_S3_FORCE_PATH_STYLE:-false}
      # Recording remains hidden and server-disabled until a per-participant
      # consent workflow is implemented and reviewed.
      ROOM_RECORDING_ENABLED: 'false'
      EGRESS_ENABLED: 'false'
      # ─── LiveKit (live audio) — REQUIRED, or every room join returns 503 ───
      # Point at LiveKit Cloud (wss://<your-project>.livekit.cloud) OR the
      # self-hosted `livekit` service below (behind your TLS proxy as
      # wss://livekit.chathouse.app). This URL is handed to clients, so it MUST
      # be the PUBLIC wss endpoint, not the internal container address.
      LIVEKIT_URL: ${LIVEKIT_URL:?LIVEKIT_URL is required (wss://...)}
      # REQUIRED for self-hosting: set http://livekit:7880 (or the private
      # service endpoint). Leave empty for LiveKit Cloud to fall back to the
      # public URL converted from wss:// to https://.
      LIVEKIT_INTERNAL_URL: ${LIVEKIT_INTERNAL_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET is required}
      LIVEKIT_TOKEN_TTL_SECONDS: ${LIVEKIT_TOKEN_TTL_SECONDS:-300}
      # ─── SMS / OTP (Twilio) — REQUIRED ───
      # Phone + OTP is the ONLY login path. With no Twilio creds the SMS sender
      # silently stubs and every real sign-in fails, so fail loudly at boot
      # (consistent with the other required secrets above). Number must be E.164.
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:?TWILIO_ACCOUNT_SID is required (phone+OTP is the only login path)}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:?TWILIO_AUTH_TOKEN is required (phone+OTP is the only login path)}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:?TWILIO_FROM_NUMBER is required (E.164 sender, e.g. +15551234567)}
      # ─── Email / password reset (Resend) — REQUIRED ─────────────────────
      # MAIL_FROM must belong to a domain verified in the Resend account.
      RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY is required (password-reset delivery)}
      MAIL_FROM: ${MAIL_FROM:?MAIL_FROM is required (verified sender email)}
      # ─── Push notifications (Firebase Cloud Messaging) — REQUIRED ───
      # Configure exactly one credential mode: inline service-account JSON, or
      # explicit ADC (workload identity / GOOGLE_APPLICATION_CREDENTIALS).
      # env.ts rejects missing, ambiguous or malformed production credentials.
      FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT:-}
      FIREBASE_USE_ADC: ${FIREBASE_USE_ADC:-false}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      PUSH_DISPATCH_ENABLED: 'true'
      # Stripe is optional. Leave ALL four values empty to disable payments;
      # setting any one makes the complete live-mode/HTTPS set mandatory at
      # backend boot and in go-live-preflight.mjs. Stripe also requires
      # EXTENSIONS_ENABLED=true.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_RETURN_URL: ${STRIPE_RETURN_URL:-}
      STRIPE_REFRESH_URL: ${STRIPE_REFRESH_URL:-}
      # mediasoup is the abandoned legacy SFU — keep it OFF in production.
      MEDIASOUP_ENABLED: 'false'
      # Observability. The metrics credential is mounted as a Compose secret;
      # its value never enters the container environment or this repository.
      SENTRY_DSN: ${SENTRY_DSN:-}
      METRICS_TOKEN_FILE: /run/secrets/chathouse_metrics_token
    secrets:
      - source: metrics_token
        target: chathouse_metrics_token
    # Loopback only — the reverse proxy terminates TLS and forwards here.
    ports:
      - '127.0.0.1:4000:4000'

  # ─── TLS-terminating reverse proxy (Caddy, automatic HTTPS) ──────────────
  # Serves https://api.chathouse.app + wss://api.chathouse.app (and LiveKit
  # signalling) with auto-provisioned Let's Encrypt certs. This is what makes
  # the production endpoints HTTPS/WSS — without it the shipped app cannot
  # connect (iOS ATS / Android cleartext / the env-guard all require TLS).
  caddy:
    image: caddy:2-alpine
    container_name: chathouse-caddy
    restart: unless-stopped
    depends_on:
      - api
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-admin@chathouse.app}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  # ─── Self-hosted LiveKit (OPTIONAL) ──────────────────────────────────────
  # Default recommendation is LiveKit Cloud (zero ops, global TURN). To
  # self-host instead, run:  docker compose -f docker-compose.prod.yml --profile selfhost up -d
  # and point LIVEKIT_URL at wss://livekit.chathouse.app (proxied to :7880).
  # Production-grade self-hosting also needs a TURN server for clients behind
  # symmetric NAT — see https://docs.livekit.io/home/self-hosting/.
  livekit:
    # Pinned to v1.12.0: the client (livekit-client 2.19 via @livekit/react-native)
    # cannot negotiate against v1.8 ("v1 RTC path not found" / signalling timeout).
    # v1.12.0 is the version the dev stack runs and is verified against this client.
    image: livekit/livekit-server:v1.12.0
    container_name: chathouse-livekit
    profiles: ['selfhost']
    restart: unless-stopped
    command: ['--config', '/etc/livekit.yaml']
    environment:
      # `key: secret` — must match LIVEKIT_API_KEY / LIVEKIT_API_SECRET above.
      LIVEKIT_KEYS: '${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}'
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
    # LiveKit needs the signalling port + a UDP range for media. Put :7880
    # behind the TLS proxy as wss; open the UDP range on the firewall.
    ports:
      - '7880:7880'
      - '7881:7881'
      - '50000-50100:50000-50100/udp'

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:

secrets:
  # The monitoring stack mounts this same host file. Keep it outside the repo
  # and set METRICS_TOKEN_SECRET_FILE to its absolute path on the host.
  metrics_token:
    file: ${METRICS_TOKEN_SECRET_FILE:?METRICS_TOKEN_SECRET_FILE is required}
